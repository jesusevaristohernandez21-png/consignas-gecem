<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consignas fijas · GECEM</title>
<style>body{margin:0;padding:18px 16px 40px;background:#eef1f5;color:#1f2937;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4}h1{font-size:19px;margin:0 0 2px;color:#0f2a44}.sub{color:#6b7280;font-size:13px;margin-bottom:14px}ol{padding-left:0;list-style:none;margin:0}li{background:#fff;border:1px solid #d7dde5;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px}li b{color:#0f2a44;min-width:22px}.pie{margin-top:24px;font-size:12px;color:#6b7280;text-align:center}.err{background:#fdecea;color:#c62828;padding:12px;border-radius:12px}</style></head>
<body><h1 id="t">Consignas fijas</h1><div class="sub" id="s">Cargando…</div><ol id="l"></ol><div class="pie">Vigilancia GECEM · lista vigente que los guardias confirman cada día</div>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbzn2N3ZLS5FOkd2zQk-f1upuXtaLaYulNNJb4Xoj6V9k6hZgHP8mA08ndqV1Ju788-2nw/exec';
var c=new URLSearchParams(location.search).get('c')||'santafe';
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
window.cb=function(r){var s=document.getElementById('s'),l=document.getElementById('l');if(!r.ok){s.innerHTML='<div class="err">'+esc(r.error||'No se pudo cargar')+'</div>';return;}
document.getElementById('t').textContent='Consignas fijas · '+r.caseta;s.textContent=r.fijas.length+' consignas vigentes · actualizado '+String(r.actualizado).slice(0,16);
l.innerHTML=r.fijas.map(function(f,i){return '<li><b>'+(i+1)+'.</b><span>'+esc(f)+'</span></li>'}).join('');};
var sc=document.createElement('script');sc.src=EXEC+'?api=fijas_publicas&callback=cb&p='+encodeURIComponent(JSON.stringify({caseta_id:c}))+'&x='+Date.now();sc.onerror=function(){cb({ok:false,error:'Sin conexión. Intenta de nuevo.'})};document.body.appendChild(sc);
</script></body></html>
